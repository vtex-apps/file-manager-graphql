enum AccessLevel {
  PUBLIC
  AUTHENTICATED
  ACCOUNT_ADMINISTRATOR
}

type BucketPolicy {
  readAccess: AccessLevel!
  writeAccess: AccessLevel!
  updatedAt: String
  updatedBy: String
}

type DeleteBucketPolicyResult {
  bucket: String!
  removedAt: String!
}

type BucketPolicyView {
  """The app that owns this bucket. listBucketPolicies spans every app sharing this account/workspace, so this disambiguates buckets that share the same plain name across different apps. Nullable (Bugbot follow-up): file-manager derives this from the stored admin policy document's own App field (BuildViewAsync), which can be absent for an indexed bucket whose only policy source is the reserved-bucket fixed table, or transiently during the index/document race documented in DeindexBucketKeyAsync -- declaring this non-null would fail the entire listBucketPolicies query for one such entry instead of returning it with app: null."""
  app: String
  bucket: String!
  """The resolved effective policy: the bucket's admin policy if one is configured, else the reserved-bucket fixed value for the 3 platform-critical buckets, else the global default. There is only ever one source in effect -- file-manager removed the separate manifest-policy tier this used to reconcile against (STR-773 amendment)."""
  policy: BucketPolicy!
}

type File {
  fileUrl: String!
  mimetype: String!
  encoding: String!
}

type Settings {
  maxFileSizeMB: Int
}

type Mutation {
  """Save file (returns file's immutable URL). Authorization is file-manager's: it enforces the bucket's writeAccess on the underlying write, so a bucket set to public accepts anonymous uploads and any other level is rejected there."""
  uploadFile(file: Upload!, bucket: String = "images"): File
  """Delete file from bucket"""
  deleteFile(path: String!, bucket: String = "images"): Boolean! @requiresAuth
  """Set admin policy for a bucket. `app` defaults to this app's own bucket namespace when omitted -- pass the `app` value returned by listBucketPolicies to target a bucket owned by a different app."""
  setBucketPolicy(bucket: String!, readAccess: AccessLevel!, writeAccess: AccessLevel!, app: String): BucketPolicy @requiresAuth
  """Delete admin policy for a bucket. `app` defaults to this app's own bucket namespace when omitted -- pass the `app` value returned by listBucketPolicies to target a bucket owned by a different app."""
  deleteBucketPolicy(bucket: String!, app: String): DeleteBucketPolicyResult! @requiresAuth
}

type Query {
  """Get file’s immutable URL"""
  getFileUrl(path: String!, bucket: String = "images"): String
  """Get file"""
  getFile(path: String!, width: Int = 1, height: Int = 2, aspect: Boolean = false, bucket: String = "images"): String
  """Settings"""
  settings: Settings
  """List bucket policies"""
  listBucketPolicies: [BucketPolicyView!]! @requiresAuth
  """Get bucket policy. `app` defaults to this app's own bucket namespace when omitted -- pass the `app` value returned by listBucketPolicies to target a bucket owned by a different app."""
  getBucketPolicy(bucket: String!, app: String): BucketPolicyView @requiresAuth
}
